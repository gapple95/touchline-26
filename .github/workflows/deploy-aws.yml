name: Deploy to AWS EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-aws
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
  GEMINI_PARAMETER_NAME: ${{ vars.GEMINI_PARAMETER_NAME || '/touchline-26/prod/gemini-api-key' }}
  GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.5-flash-lite' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.13.1
          cache: npm

      - run: npm ci
      - run: npm test
      - run: docker compose config --quiet
      - name: Validate AWS Compose configuration
        env:
          APP_IMAGE: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/touchline-26:test
        run: docker compose -f compose.aws.yml config --quiet

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6

      - name: Validate deployment variables
        shell: bash
        env:
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
        run: |
          set -Eeuo pipefail
          for name in AWS_ROLE_ARN AWS_REGION ECR_REPOSITORY EC2_INSTANCE_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing GitHub production variable: $name" >&2
              exit 1
            fi
          done

      - name: Configure short-lived AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sign in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push application image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Sync deployment files and deploy through SSM
        id: deploy
        shell: bash
        env:
          IMAGE_URI: ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          set -Eeuo pipefail

          compose_b64="$(base64 -w 0 compose.aws.yml)"
          nginx_b64="$(base64 -w 0 nginx/nginx.conf)"
          app_conf_b64="$(base64 -w 0 nginx/conf.d/app.conf)"
          deploy_b64="$(base64 -w 0 scripts/ec2-deploy.sh)"

          parameters="$(jq -nc \
            --arg compose "$compose_b64" \
            --arg nginx "$nginx_b64" \
            --arg app_conf "$app_conf_b64" \
            --arg deploy "$deploy_b64" \
            --arg image "$IMAGE_URI" \
            --arg region "$AWS_REGION" \
            --arg parameter "$GEMINI_PARAMETER_NAME" \
            --arg model "$GEMINI_MODEL" \
            '{commands: [
              "sudo install -d -m 0755 /opt/touchline-26/nginx/conf.d /opt/touchline-26/scripts",
              ("echo " + $compose + " | base64 -d | sudo tee /opt/touchline-26/compose.aws.yml >/dev/null"),
              ("echo " + $nginx + " | base64 -d | sudo tee /opt/touchline-26/nginx/nginx.conf >/dev/null"),
              ("echo " + $app_conf + " | base64 -d | sudo tee /opt/touchline-26/nginx/conf.d/app.conf >/dev/null"),
              ("echo " + $deploy + " | base64 -d | sudo tee /opt/touchline-26/scripts/deploy.sh >/dev/null"),
              "sudo chmod 0755 /opt/touchline-26/scripts/deploy.sh",
              ("sudo /opt/touchline-26/scripts/deploy.sh " + $image + " " + $region + " " + $parameter + " " + $model)
            ]}')"

          command_id="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "Deploy TOUCHLINE 26 ${GITHUB_SHA}" \
            --parameters "$parameters" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=$command_id" >> "$GITHUB_OUTPUT"

          deployment_status="Pending"
          for _ in $(seq 1 120); do
            deployment_status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)"
            case "$deployment_status" in
              Success|Cancelled|TimedOut|Failed|Cancelling) break ;;
              *) sleep 5 ;;
            esac
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}'

          if [ "$deployment_status" != "Success" ]; then
            echo "Deployment ended with status: $deployment_status" >&2
            exit 1
          fi
